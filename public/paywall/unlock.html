<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unlock FightFlow</title>
<link rel="icon" href="/favicon.ico">
<style>
  @font-face { font-family: Poster; font-style: italic; font-weight: 800; src: url(/paywall/fonts/BarlowCondensed_800ExtraBold_Italic.ttf); font-display: swap; }
  @font-face { font-family: Caps; font-weight: 600; src: url(/paywall/fonts/BarlowCondensed_600SemiBold.ttf); font-display: swap; }
  @font-face { font-family: Text; font-weight: 400; src: url(/paywall/fonts/InterTight_400Regular.ttf); font-display: swap; }
  @font-face { font-family: Text; font-weight: 600; src: url(/paywall/fonts/InterTight_600SemiBold.ttf); font-display: swap; }
  :root { --red: #E8202A; --ink: #070707; --dim: #B5B5B5; --mute: #6E6E6E; --line: #2C2C2C;
    --fluid: cubic-bezier(.22,1,.36,1); --enter: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: #fff; font: 400 16px/1.5 Text, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(70% 50% at 78% 12%, rgba(232,32,42,.5), rgba(232,32,42,0) 70%); }
  .tape { position: fixed; right: -60px; top: 26px; width: 220px; height: 18px; background: var(--red); transform: rotate(-14deg); }
  main { position: relative; max-width: 520px; margin: 0 auto; padding: max(72px, env(safe-area-inset-top)) 22px 48px; }
  .kick { font: 600 15px Caps, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  h1 { font: 800 italic clamp(64px, 18vw, 104px)/.88 Poster, sans-serif; text-transform: uppercase; letter-spacing: -.01em; margin-top: 10px; padding-right: .06em; }
  h1 em { color: var(--red); font-style: italic; display: block; }
  .sub { color: var(--dim); margin-top: 16px; max-width: 380px; }
  form { margin-top: 36px; }
  label { display: block; font: 600 13px Caps, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
  input { width: 100%; margin-top: 8px; background: transparent; border: 0; border-bottom: 1.5px solid var(--line); color: #fff; padding: 12px 0;
    font: 600 clamp(14px, 4.1vw, 20px) Text, monospace; letter-spacing: .02em; text-transform: uppercase; outline: none; transition: border-color 160ms var(--fluid); border-radius: 0; }
  input:focus { border-bottom-color: var(--red); }
  input::placeholder { color: #3a3a3a; }
  .btn { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; margin-top: 22px; border: 0; background: transparent;
    color: #fff; cursor: pointer; font: 800 italic 24px Poster, sans-serif; text-transform: uppercase; letter-spacing: .04em; text-decoration: none; transition: transform 320ms var(--fluid); }
  .btn::before { content: ''; position: absolute; inset: 0 10px 0 -20px; background: var(--red); transform: skewX(-12deg); z-index: -1; }
  .btn:active { transform: scale(.96); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .ghost { min-height: 52px; font-size: 19px; border: 1.5px solid var(--line); margin-top: 12px; }
  .ghost::before { display: none; }
  .msg { min-height: 24px; margin-top: 14px; color: var(--dim); }
  .msg.err { color: #ff6b72; }
  .rule { height: 1px; background: #1E1E1E; margin: 40px 0 18px; }
  .help { color: var(--mute); font-size: 14px; }
  .help b { color: var(--dim); font-weight: 600; }
  main > * { animation: rise 560ms var(--enter) both; }
  main > *:nth-child(2) { animation-delay: 45ms } main > *:nth-child(3) { animation-delay: 90ms } main > *:nth-child(4) { animation-delay: 135ms } main > *:nth-child(5) { animation-delay: 180ms }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) { main > * { animation: fade 120ms linear both; } @keyframes fade { from { opacity: 0 } } .btn { transition: none; } }
</style>
</head>
<body>
<div class="glow"></div><div class="tape"></div>
<main>
  <div class="kick">FightFlow · Members only</div>
  <h1>Gloves on.<em>Unlock it.</em></h1>
  <p class="sub" id="sub">Enter the license key from your Gumroad receipt to open FightFlow on this device.</p>
  <form id="form" novalidate>
    <label for="key">License key</label>
    <input id="key" name="key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" required>
    <button class="btn" id="go" type="submit">Unlock FightFlow</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <div>
    <a class="btn ghost" id="buy" href="#" hidden>Buy FightFlow</a>
    <div class="rule"></div>
    <p class="help">Lost your key? It's in the email Gumroad sent when you bought, and in your <b>Gumroad library</b> under FightFlow.</p>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const msg = (text, err) => { $('msg').textContent = text || ''; $('msg').className = 'msg' + (err ? ' err' : ''); };
  const params = new URLSearchParams(location.search);
  if (params.get('reason') === 'revoked') msg('Your access ended (refund or membership change). Enter an active key to continue.', true);

  // Only ever send people back inside this site.
  const nextUrl = () => { const n = params.get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; };

  fetch('/api/unlock', { cache: 'no-store' }).then((r) => r.json()).then((c) => {
    if (c.buyUrl && /^https:\/\//.test(c.buyUrl)) { $('buy').href = c.buyUrl; $('buy').hidden = false; }
    if (!c.configured) { msg('Purchases are not connected yet. Check back soon.', true); $('go').disabled = true; }
  }).catch(() => {});

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const licenseKey = $('key').value.trim();
    if (!/^[A-Za-z0-9]{8}(-[A-Za-z0-9]{8}){3}$/.test(licenseKey)) return msg('That doesn’t look like a license key. It has four groups of 8 characters.', true);
    $('go').disabled = true; msg('Checking with Gumroad…');
    try {
      const r = await fetch('/api/unlock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ licenseKey }) });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) { msg('Unlocked. Let’s go.'); location.replace(nextUrl()); return; }
      msg(data.message || 'Something went wrong. Try again.', true);
    } catch { msg('No connection. Check your internet and try again.', true); }
    $('go').disabled = false;
  });
})();
</script>
</body>
</html>
